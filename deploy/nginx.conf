# Production reverse proxy for the smart shared reading-room system.
#
# The Vite dev server proxies /api -> 127.0.0.1:8080 ONLY in dev mode.
# When you serve the built dist/ statically (Huawei Cloud ECS, nginx, etc.),
# you MUST add this reverse proxy or every page will fail with 404 on /api.
#
# Usage (Linux ECS):
#   npm run build                      # produces frontend/reading-room-front/dist
#   sudo cp -r dist /opt/studyroom/frontend
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/studyroom.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   # backend runs on 127.0.0.1:8080 (see README), open ECS security group port 80
server {
    listen 80;
    server_name _;

    root /opt/studyroom/frontend;
    index index.html;

    # Vue Router uses hash history, so a SPA fallback is optional but harmless.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;   # no trailing slash: keeps the /api prefix
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}

# Backend as a systemd service (optional, /etc/systemd/system/studyroom.service):
# [Unit]
# Description=studyroom backend
# After=network.target mysql.service
# [Service]
# WorkingDirectory=/opt/studyroom/backend
# Environment=FG_ENDPOINT=
# Environment=STUDY_DB_USER=study
# Environment=STUDY_DB_PASSWORD=Study@123456
# ExecStart=/usr/bin/java -Dfile.encoding=UTF-8 -jar /opt/studyroom/backend/studyroom-backend-1.0.0.jar
# Restart=always
# [Install]
# WantedBy=multi-user.target
